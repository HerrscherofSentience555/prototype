job_name: custom-model-smoke
mode: COLD_START
backend:
  name: custom
  runtime_platform: windows_wsl
  dlrm_root: /mnt/c/Users/<your-name>/Desktop/dlrm
  python_env: ~/venvs/torchrec17
  wsl_distribution: Ubuntu-22.04
nproc_per_node: 1
model:
  file: examples/models/custom_simple_model.py
data:
  format: random
  batch_size: 4
training:
  epochs: 1
  max_steps: 2
  learning_rate: 0.01
checkpoint:
  enabled: true
  save_optimizer: true
profile:
  enabled: false
