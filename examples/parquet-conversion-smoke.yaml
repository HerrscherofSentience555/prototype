job_name: parquet-conversion-smoke
mode: COLD_START
backend:
  name: dlrm
  runtime_platform: windows_wsl
  dlrm_root: /mnt/c/Users/<your-name>/Desktop/dlrm
  python_env: ~/venvs/torchrec17
  wsl_distribution: Ubuntu-22.04
nproc_per_node: 1
data:
  format: parquet
  train_path: data/business_ctr/train.parquet
  validation_path: data/business_ctr/validation.parquet
  test_path: data/business_ctr/test.parquet
  schema_path: examples/schemas/parquet-smoke-schema.yaml
  batch_size: 4
  test_batch_size: 4
training:
  epochs: 1
  max_steps: 1
  learning_rate: 0.01
checkpoint:
  enabled: false
profile:
  enabled: false
